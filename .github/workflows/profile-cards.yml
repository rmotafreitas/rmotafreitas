name: Generate profile cards
on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate stats cards and snake into the output branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&bg_color=0d1117&title_color=ff8c42&icon_color=ff6b35&text_color=ffd8b5&ring_color=e8467c&border_color=ff8c42&border_radius=15
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0d1117&title_color=ff8c42&text_color=ffd8b5&border_color=ff8c42&border_radius=15
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff6b35&color_dots=#ebedf0,#ffd8b5,#ffab73,#ff8c42,#e8467c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8c42&color_dots=#161b22,#5a2a12,#a3441b,#e0622a,#ff8c42

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
